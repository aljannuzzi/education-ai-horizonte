<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1584" viewBox="0 0 1760 1584" role="img" aria-labelledby="title desc" lang="pt-BR">
<title id="title">Como a TI opera em Azure e Fabric — Arquitetura de referência</title>
<desc id="desc">Arquitetura de referência, não prova de provisionamento. Microsoft 365 e Entra ID são serviços externos ao resource group. OAuth delegado autentica o professor no MCP Horizonte em Azure Container Apps Consumption. O aplicativo contém MCP e adapters; especialistas usam Azure OpenAI. Blob guarda rascunhos e auditoria, não é OneLake nem fonte oficial. A identidade gerenciada atribuída pelo usuário recebe RBAC em OpenAI, Blob e ACR. Um service principal dedicado, distinto da identidade gerenciada e do usuário, acessa o Fabric com permissão mínima no workspace e nos dados. O workspace SaaS contém Data Agent, ontologia nativa Fabric IQ e lakehouse no OneLake. A capacidade F2 ou superior tem provisionamento e cobrança ARM, mas não move o workspace para o Container App. GitHub e Bicep configuram recursos; ACR fornece a imagem OCI. Linhas tracejadas indicam deploy e telemetria, não consultas de dados.</desc>
