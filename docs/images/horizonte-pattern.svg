<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1536" viewBox="0 0 1760 1536" role="img" aria-labelledby="title desc" lang="pt-BR">
<title id="title">O pattern completo — Arquitetura de referência</title>
<desc id="desc">Arquitetura de referência, não comprovação de provisionamento. O professor usa o Copilot nativo, com Skills e contexto autorizado do Work IQ. O MCP Horizonte valida argumentos e escopo, consulta o Fabric Data Agent e, separadamente, aciona especialistas de IA. O Fabric IQ fornece ontologia nativa vinculada ao lakehouse no OneLake. Fontes educacionais sintéticas alimentam o lakehouse de baixo para cima; consultas seguem para baixo. Evidências, origem e sugestões voltam pelo MCP ao Copilot. O professor revisa os resultados antes de qualquer alteração ou comunicação; não há notas automáticas.</desc>
