<text x="40" y="64" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="600"><tspan x="40" y="102">Cowork + Fabric IQ nativo</tspan></text>
<text x="40" y="120" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400"><tspan x="40" y="144">O Cowork conduz o raciocínio. O plugin nativo consulta os dados com sua identidade.</tspan></text>
