<text x="96" y="904" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400"><tspan x="96" y="929">Fatos do relatório + proposta pedagógica + incertezas</tspan><tspan x="96" y="964">Plano de aula, alternativa offline e rascunhos revisáveis</tspan><tspan x="96" y="999">Sem notas, frequência ou comunicação automáticas</tspan></text>
