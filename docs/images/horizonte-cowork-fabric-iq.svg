<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1168" viewBox="0 0 1760 1168" role="img" aria-labelledby="title desc" lang="pt-BR">
<title id="title">Cowork + Fabric IQ nativo — Arquitetura de referência</title>
<desc id="desc">Caminho de relatório, distinto de consulta à ontologia. O professor conversa no aplicativo Microsoft 365 Copilot, dentro do Cowork. A skill Horizonte Professor orienta o procedimento e a descoberta do relatório. O plugin Fabric IQ já autorizado consulta o relatório Horizonte Professor e seu modelo semântico Power BI, ligado aos dados educacionais no Lakehouse. Cowork raciocina sobre as respostas e prepara alternativas e artefatos para revisão docente. Não há novo conector OAuth próprio, endpoint anônimo ou chamada à ontologia/Data Agent nesse caminho. A identidade e as permissões Microsoft 365 e Fabric são preservadas.</desc>
<defs>
<marker id="end" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#596571" stroke-width="1.6"/></marker>
<marker id="start" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M10 2 L2 6 L10 10" fill="none" stroke="#596571" stroke-width="1.6"/></marker>
</defs>
