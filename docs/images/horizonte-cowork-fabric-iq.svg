<text x="40" y="1064" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600"><tspan x="40" y="1088">Este caminho consulta relatório/modelo semântico. Não invoca a ontologia ou o Data Agent diretamente.</tspan></text>
